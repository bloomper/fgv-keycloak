on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    types: [ opened, synchronize, reopened ]
name: Build Workflow
permissions:
  contents: read
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Determine image tags
        id: image
        if: github.event_name == 'push'
        run: |
          repo=bloomper/fgv-keycloak
          sha=sha-${GITHUB_SHA::7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form vX.Y.Z"
              exit 1
            fi
            if docker manifest inspect "$repo:$version" > /dev/null 2>&1; then
              echo "::error::$repo:$version already exists on Docker Hub"
              exit 1
            fi
            echo "tags=$repo:$version,$repo:latest,$repo:$sha" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$repo:develop,$repo:$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
