version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/providers"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/theme"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Versions below are dictated by the peer dependencies of @keycloakify/keycloak-account-ui
    # and @keycloakify/keycloak-ui-shared; bump them together with those packages
    ignore:
      - dependency-name: "@keycloak/keycloak-admin-client"
      - dependency-name: "react-hook-form"
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next-fetch-backend"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not yet support TypeScript 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react does not yet support ESLint 10
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
